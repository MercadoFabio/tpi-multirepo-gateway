worker_processes auto;

events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

  log_format gateway_log '[$time_local] [CASE-2-GATEWAY] $remote_addr - "$request" -> Upstream: $upstream_addr (Status: $status, Time: ${upstream_response_time}s)';
  access_log /dev/stdout gateway_log;

  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_next_upstream off;

  server {
    listen 80;
    server_name _;
    add_header Cache-Control "no-store" always;

    location = /health {
      default_type application/json;
      return 200 '{"status":"UP","service":"case-2-gateway"}';
    }

    location = /api {
      return 404;
    }

    location = /api/ {
      return 404;
    }

    location ^~ /api/v1/actuator {
      return 404;
    }

    location ^~ /api/v1/internal {
      return 404;
    }

    location ~ ^/(actuator|internal)(/|$) {
      return 404;
    }

    location = /api/v1/auth/login {
      limit_req zone=login burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://bff:8080;
    }

    location ^~ /api/v1/ {
      proxy_pass http://bff:8080;
    }

    location = /usuarios {
      return 308 /usuarios/;
    }

    location ^~ /usuarios/ {
      proxy_pass http://usuarios-ssr:4000;
    }

    location = /productos {
      return 308 /productos/;
    }

    location ^~ /productos/ {
      proxy_pass http://productos-ssr:4000;
    }

    location / {
      proxy_pass http://shell-ssr:4000;
    }
  }
}
