worker_processes auto;

events {
  worker_connections 1024;
}

http {
  limit_req_zone \ zone=login:10m rate=5r/m;

  log_format frontend_gateway_log '[\] [FRONTEND-NGINX] \ - "\" -> Target: \ (Status: \, Time: \s)';
  access_log /dev/stdout frontend_gateway_log;

  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_http_version 1.1;
  proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
  proxy_set_header X-Real-IP \;
  proxy_set_header X-Forwarded-For \;
  proxy_set_header X-Forwarded-Proto \;

  server {
    listen 80;
    server_name localhost;

    location = /health {
      default_type application/json;
      return 200 '{"status":"UP","service":"frontend-gateway"}';
    }

    # API Backend: Invocaciones al BFF (Seguridad, Login y Orquestación)
    location = /api/v1/auth/login {
      limit_req zone=login burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://bff:3000;
    }

    location ^~ /api/v1/ {
      proxy_pass http://bff:3000;
    }

    # Microfrontend Independiente: Usuarios (CSR)
    location = /usuarios {
      return 308 /usuarios/;
    }

    location ^~ /usuarios/ {
      proxy_pass http://usuarios:80/;
    }

    # Microfrontend Independiente: Productos (CSR)
    location = /productos {
      return 308 /productos/;
    }

    location ^~ /productos/ {
      proxy_pass http://productos:80/;
    }

    # Shell Principal (Dashboard y Login CSR)
    location / {
      proxy_pass http://shell:80;
    }
  }
}
