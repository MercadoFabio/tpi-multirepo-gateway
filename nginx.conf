events {}

http {
  upstream shell {
    server shell:80;
  }

  upstream usuarios {
    server usuarios:80;
  }

  upstream productos {
    server productos:80;
  }

  server {
    listen 80;

    location /usuarios/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://usuarios/;
    }

    location /productos/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://productos/;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://shell;
    }
  }
}
