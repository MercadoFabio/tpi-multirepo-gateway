services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - shell
      - usuarios
      - productos

  shell:
    build:
      context: ../tpi-multirepo-shell
    expose:
      - "80"

  usuarios:
    build:
      context: ../tpi-multirepo-usuarios
    expose:
      - "80"

  productos:
    build:
      context: ../tpi-multirepo-productos
    expose:
      - "80"
